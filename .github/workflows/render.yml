name: Render Quarto reports

on:
  # Weekly — Monday 11:00 UTC ≈ Monday 06:00 Central (05:00 during standard time).
  schedule:
    - cron: "0 11 * * 1"
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # Re-render immediately when a source file changes on main.
  push:
    branches: [main]
    paths:
      - "WpgNonResPermits.qmd"
      - "WpgMultiResPermits.qmd"
      - "WpgDemoPermits.qmd"
      - "WpgNeighbourhoods.geojson"
      - "WpgNeighbourhoodClusters.geojson"
      - "index.html"
      - ".github/workflows/render.yml"

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system libraries for sf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::dplyr
            any::tidyr
            any::stringr
            any::lubridate
            any::leaflet
            any::leaflet.extras
            any::DT
            any::crosstalk
            any::htmltools
            any::downloadthis
            any::rlang
            any::sf

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore render cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: quarto-render-cache-${{ github.run_id }}
          restore-keys: |
            quarto-render-cache-

      - name: Render Non-Residential report
        run: quarto render WpgNonResPermits.qmd

      - name: Render Multi-Residential report
        run: quarto render WpgMultiResPermits.qmd

      - name: Render Demolition report
        run: quarto render WpgDemoPermits.qmd

      - name: Commit rendered HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WpgNonResPermits.html WpgMultiResPermits.html WpgDemoPermits.html
          if git diff --cached --quiet; then
            echo "No HTML changes."
          else
            git commit -m "chore(render): auto-rebuild reports ($(date -u +%Y-%m-%d))"
            git push
          fi
