name: Render Quarto reports

on:
  # Weekly — Monday 11:00 UTC ≈ Monday 06:00 Central (05:00 during standard time).
  schedule:
    - cron: "0 11 * * 1"
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # Re-render immediately when a source file changes on main.
  push:
    branches: [main]
    paths:
      - "WpgNonResPermits.qmd"
      - "WpgMultiResPermits.qmd"
      - "WpgDemoPermits.qmd"
      - "WpgNeighbourhoods.geojson"
      - "WpgNeighbourhoodClusters.geojson"
      - "index.html"
      - ".github/workflows/render.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system libraries for sf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::dplyr
            any::tidyr
            any::stringr
            any::lubridate
            any::leaflet
            any::leaflet.extras
            any::DT
            any::crosstalk
            any::htmltools
            any::downloadthis
            any::rlang
            any::sf

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore render cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: quarto-render-cache-${{ github.run_id }}
          restore-keys: |
            quarto-render-cache-

      - name: Render Non-Residential report
        run: quarto render WpgNonResPermits.qmd

      - name: Render Multi-Residential report
        run: quarto render WpgMultiResPermits.qmd

      - name: Render Demolition report
        run: quarto render WpgDemoPermits.qmd

      - name: Commit rendered HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WpgNonResPermits.html WpgMultiResPermits.html WpgDemoPermits.html
          if git diff --cached --quiet; then
            echo "No HTML changes."
          else
            git commit -m "chore(render): auto-rebuild reports ($(date -u +%Y-%m-%d))"
            git push
          fi

      # --- Failure notification (mirrors the cmhc-charts pattern) ---------
      # The email step self-skips until MAIL_USERNAME/MAIL_PASSWORD secrets +
      # MAIL_TO var are set on this repo (default SMTP is smtp.gmail.com:587 —
      # override via SMTP_HOST/SMTP_PORT vars). The issue step always fires on
      # failure using the auto-provided GITHUB_TOKEN.
      - name: Email gate — failure
        if: failure()
        id: fail_email_gate
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO:       ${{ vars.MAIL_TO }}
        run: |
          if [ -z "$MAIL_USERNAME" ] || [ -z "$MAIL_PASSWORD" ] || [ -z "$MAIL_TO" ]; then
            echo "Email secrets/vars not configured — skipping notification."
            echo "send=false" >> "$GITHUB_OUTPUT"
          else
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send failure email
        if: failure() && steps.fail_email_gate.outputs.send == 'true'
        uses: dawidd6/action-send-mail@2cea9617b09d79a095af21254fbcb7ae95903dde # v3.12.0
        with:
          server_address: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          server_port:    ${{ vars.SMTP_PORT || 587 }}
          secure:         true
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          from:           Winnipeg Permits <${{ secrets.MAIL_USERNAME }}>
          to:             ${{ vars.MAIL_TO }}
          subject:        "[Winnipeg Permits] Render FAILED — run ${{ github.run_id }}"
          body: |
            The scheduled Quarto render workflow FAILED.

            Trigger:  ${{ github.event_name }}
            Run log:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit:   ${{ github.sha }}

            Vercel will not see new HTML until this is fixed and re-run.

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Render failed ($(date -u +%Y-%m-%d))" \
            --body "The scheduled \`Render Quarto reports\` workflow failed.

          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Trigger: ${{ github.event_name }}
          - Commit: ${{ github.sha }}

          Likely causes: a transient CRAN/package install, the sf system-lib install, a Quarto render error, or a Winnipeg Open Data (Socrata) API change. Re-running often clears transient failures." \
            || echo "issue create failed (duplicate or token scope) — continuing"
